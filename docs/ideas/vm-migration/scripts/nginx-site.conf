# VM 網站容器 gama-site 的 nginx 設定（由 deploy-site.sh 放到 VM 的 ~/site-conf/default.conf）。
# 網頁與 API 走同一個網址（使用者 2026-11-09）：資料相關路徑轉給 VM 上的 Supabase API 閘道（port 8000），
# 其他給靜態網頁。之後開 HTTPS 只要一張憑證，網頁也不會因為「https 頁面連 http API」被瀏覽器擋。
# 系統只用到 /rest/v1（讀寫預約）與 /realtime/v1（即時同步，WebSocket）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /rest/v1/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /realtime/v1/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
