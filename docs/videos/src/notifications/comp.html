<!DOCTYPE html>
<html lang="en">
<head>

<title>Gama Meeting Room · film C · the bell rings</title>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#1c3050}
canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}

<body>

<script src="look.js"></script>

<script>
// ══════════════════════════════════════════════════════════════════════════════════════════════
// Film C «the bell rings» — desktop notifications in Gama Meeting Room, 20 s.
// N1: Maya (left) adds Iris to "Urgent Alignment"; the booking folds into a capsule, flies over the
//     midline and rings Iris's bell; "New meeting" grows out of the bell; Iris clicks it → the detail
//     modal → it folds into its cell in her week view.
// N2: the same cell. Maya moves it (the block slides 16:00 → 14:30, "changed" drops from the bell);
//     the now-line ticks to 10 min before (the block itself sends "Starting soon"); Maya deletes it
//     (the block snaps into "Meeting cancelled"). The bell carries the film into the end card.
// Notification copy: index.html:2918–2927 (en strings) assembled as mycalBuildNotification() does
// (index.html:8054–8105; date format 8044–8050; tRoom → '301' index.html:2683).
// All people, subjects and times are fictional (plan.md). Pure f(t).
// ══════════════════════════════════════════════════════════════════════════════════════════════
const W = 1920, H = 1080, DUR = 20;
const {clamp, lerp, sstep, ease, seg} = OM;
const cubicIn = u => { u = clamp(u, 0, 1); return u * u * u; };
const cv = document.getElementById('cv'), DPR = window.devicePixelRatio || 1;
cv.width = W * DPR; cv.height = H * DPR;
const g = cv.getContext('2d');

// ────────────────────────────── timeline ──────────────────────────────
const T = {
  IN: -0.12, I_BELL: 0.55, M_ATT: 0.95, TYPE0: 1.02, ENTER: 1.40, CONFIRM: 1.78,
  FOLD0: 1.86, FOLD1: 2.22, HIT: 2.80, N1_0: 2.95,
  I_CLICK: 4.75, MOD0: 4.80, CELL0: 6.10, LAND: 6.55,
  GROW0: 6.70, GROW1: 7.50, MP0: 7.20, M_PENCIL: 8.05, ROLL0: 8.12, ROLL1: 8.42,
  SLIDE0: 8.55, RING2: 9.55, N2_0: 9.62, N2_OUT: 11.30,
  TICKS: [12.0, 12.55, 13.1], PULSE: 13.40, N3_0: 13.50, N3_OUT: 14.95,
  M_TRASH: 15.45, N4_0: 15.50, N4_OUT: 16.80,
  END0: 17.05, BLAND: 17.60, TITLE: [17.55, 17.67, 17.79], TAG: 18.05,
};
const OUTD = 0.26;                         // a card folding back into the bell
window.__meta = { dur: DUR, fps: 30, w: W, h: H,
  inFrame: { bell: [0.4, 17.0], notif: [3.3, 4.7, 'whole'], modal: [5.2, 6.05, 'whole'], block: [6.6, 15.45, 'whole'],
             chg: [10.0, 11.25, 'whole'], rem: [13.9, 14.9, 'whole'], del: [15.8, 16.75, 'whole'], mpane: [7.7, 15.4, 'whole'],
             title: [18.0, 20, 'whole'] } };

// ────────────────────────────── palette (product tokens) ──────────────────────────────
const C = { navy: '#2d4874', navy2: '#1a2e4a', band: '#223d66', ink: '#1f2937', ink2: '#374151', mute: '#6b7280', ph: '#9ca3af',
  border: '#cfd8e3', line: '#e5eaf1', yel: '#f4c444', green: '#059669', red: '#dc2626' };
const ROOM = {
  '302': { bar: '#3b82f6', bg: '#dbeafe', fg: '#1e3a8a' }, '301': { bar: '#e11d48', bg: '#ffe4e6', fg: '#9f1239' },
  'Pantry': { bar: '#10b981', bg: '#d1fae5', fg: '#065f46' }, 'Studio': { bar: '#8b5cf6', bg: '#ede9fe', fg: '#5b21b6' },
  'Lounge': { bar: '#f97316', bg: '#ffedd5', fg: '#9a3412' }, 'Reception Area': { bar: '#06b6d4', bg: '#cffafe', fg: '#155e75' } };
const LEGEND = ['302', '301', 'Pantry', 'Studio', 'Lounge', 'Reception Area'];

// ────────────────────────────── the notifications — strings exactly as the product assembles them ──────────────────────────────
// insert/delete body '{title} · {date} {start}–{end} · {room}' (en dash); change body '{before} → {after}', each side
// `${date} ${start}-${end} ${room}` (hyphen, index.html:8086–8087); remind body '{title} starts at {start} · {room}'.
const MEET = { title: 'Urgent Alignment', date: '9/24 (Thu)', room: '301' };
const NOTE = {
  new: { title: 'New meeting', body: [`${MEET.title} · ${MEET.date} 16:00–17:00 · ${MEET.room}`] },
  chg: { title: `${MEET.title} changed`, body: [`${MEET.date} 16:00-17:00 ${MEET.room}`, `→ ${MEET.date} 14:30-15:30 ${MEET.room}`],
         full: `${MEET.date} 16:00-17:00 ${MEET.room} → ${MEET.date} 14:30-15:30 ${MEET.room}` },
  rem: { title: 'Starting soon', body: [`${MEET.title} starts at 14:30 · ${MEET.room}`] },
  del: { title: 'Meeting cancelled', body: [`${MEET.title} · ${MEET.date} 14:30–15:30 · ${MEET.room}`] },
};

// ────────────────────────────── geometry ──────────────────────────────
// Iris's app, drawn in its own units (1000 × 760) inside a world rect.
const APPW = 1000, APPH = 760;
const APP1 = { x: 1010, y: 212, w: 840, h: 840 * APPH / APPW };
const APP2 = { x: 575, y: 46, w: 1290, h: 1290 * APPH / APPW };
const BELL = { cx: 842, cy: 96, r: 17 }, CAPS = { x: 866, y: 80, w: 118, h: 32 };
const GX = 20, TIMEW = 56, COLW = (960 - TIMEW) / 7, GRID_TOP = 212, HEAD_H = 50, ROW0 = 262, ROWH = 40;
const colX = d => GX + TIMEW + d * COLW;
const rowY = min => ROW0 + (min - 720) / 30 * ROWH;
const DAYS = [['Mon', '9/21'], ['Tue', '9/22'], ['Wed', '9/23'], ['Thu', '9/24'], ['Fri', '9/25'], ['Sat', '9/26'], ['Sun', '9/27']];
const TODAY = 3;
const OTHER = [ { d: 2, s: 780, len: 30, title: 'Standup', room: 'Lounge' }, { d: 2, s: 900, len: 30, title: 'Client Call', room: 'Reception Area' },
  { d: 2, s: 960, len: 30, title: 'Retro', room: 'Studio' }, { d: 3, s: 750, len: 30, title: '1:1 with Leo', room: '302' },
  { d: 4, s: 810, len: 60, title: 'Budget Check', room: 'Pantry' } ];
const DAYCOUNT = [0, 0, 5, 2, 2, 0, 0];         // Wed 10:00 ×2 and Thu 09:00 sit above the visible rows
const blockA = (d, s, len) => ({ x: colX(d) + 4, y: rowY(s) + 3, w: COLW - 8, h: len / 30 * ROWH - 6 });

// Maya's side
const FORM = { x: 80, y: 272, w: 800, h: 520 };               // New Booking, form units = world units
const MCAPS1 = { x: 80, y: 206, w: 150, h: 40 }, MCAPS2 = { x: 92, y: 262, w: 150, h: 40 };
const PANE = { x: 92, y: 318, w: 430, h: 430 * 380 / 460 };      // Maya's detail modal, units 460 × 380
const PS = PANE.w / 460;
// notification cards (world)
const NW = 500, NH = 112, NH2 = 140;
const NC1 = { x: 1352, y: 334, w: NW, h: NH };
const NC2 = { x: 1362, y: 212, w: NW, h: NH };
const NC2C = { x: 1362, y: 212, w: NW, h: NH2 };
const NC3 = { x: 1352, y: 626, w: NW, h: NH };
const MOD1 = { x: 1198, y: 330, w: 460, h: 380 };
const CAPSULE = { x: 80 + 400 - 150, y: 272 + 260 - 26, w: 300, h: 52 };

// ────────────────────────────── helpers ──────────────────────────────
const mul = (P, Q) => [P[0] * Q[0] + P[2] * Q[1], P[1] * Q[0] + P[3] * Q[1], P[0] * Q[2] + P[2] * Q[3], P[1] * Q[2] + P[3] * Q[3],
  P[0] * Q[4] + P[2] * Q[5] + P[4], P[1] * Q[4] + P[3] * Q[5] + P[5]];
const setM = M => g.setTransform(M[0] * DPR, M[1] * DPR, M[2] * DPR, M[3] * DPR, M[4] * DPR, M[5] * DPR);
const SCREEN = [1, 0, 0, 1, 0, 0];
const font = (px, w = 500, role = 'text') => LOOK.font(role, px, w);
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, w / 2, h / 2))); }
function text(s, x, y, px, w, col, align = 'left', role = 'text') { g.font = font(px, w, role); g.fillStyle = col; g.textAlign = align; g.textBaseline = 'alphabetic'; g.fillText(s, x, y); }
function tw(s, px, w = 500, role = 'text') { g.font = font(px, w, role); return g.measureText(s).width; }
function fit(s, maxW, px, w) { if (tw(s, px, w) <= maxW) return s; let n = s.length; while (n > 1 && tw(s.slice(0, n) + '...', px, w) > maxW) n--; return s.slice(0, n) + '...'; }
// a spring that is exactly 1 after it has settled, so the holds are dead still
const spr = (tau, z = 0.7, w = 16, tEnd = 0.9) => tau <= 0 ? 0 : tau >= tEnd ? 1 : OM.spring(tau, z, w);
const ringOut = (tau, decay, omega, tEnd = 0.9) => tau <= 0 || tau >= tEnd ? 0 : OM.ring(tau, decay, omega) * (1 - sstep(tEnd - 0.15, tEnd, tau));
const lerpRect = (A, B, k) => ({ x: lerp(A.x, B.x, k), y: lerp(A.y, B.y, k), w: lerp(A.w, B.w, k), h: lerp(A.h, B.h, k) });
const inW = (R, p) => [R.x + p[0] * R.w / APPW, R.y + p[1] * R.w / APPW];                // app units → world
const rectW = (R, b) => { const s = R.w / APPW; return { x: R.x + b.x * s, y: R.y + b.y * s, w: b.w * s, h: b.h * s }; };
function mix(a, b, k) { const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return `rgb(${pa.map((v, i) => Math.round(lerp(v, pb[i], k))).join(',')})`; }
const PARTS = { cursor: new Path2D('M4 3 L30 22 L18 24 L26 40 L20 43 L12 27 L4 36 Z') };

// ────────────────────────────── derived state (pure) ──────────────────────────────
function appRect(t) { if (t < T.GROW0) return APP1; return lerpRect(APP1, APP2, ease.quintInOut(seg(t, T.GROW0, T.GROW1))); }
function appAlpha(t) { return OM.popIn(t, T.IN, { rise: 0 }).op * (1 - sstep(T.END0, T.END0 + 0.55, t)); }
function blockStart(t) { return t < T.SLIDE0 ? 960 : lerp(960, 870, spr(t - T.SLIDE0, 0.6, 8.5, 1.3)); }
function nowMin(t) { let m = 830; for (const tk of T.TICKS) m += 10 * spr(t - tk, 0.75, 34, 0.35); return m; }
const blockLive = t => t >= T.LAND && t < T.N4_0;
function blockWorld(t) { return rectW(appRect(t), blockA(TODAY, blockStart(t), 60)); }
function bellWorld(t) {                     // the bell: in Iris's header, then it carries the film into the end card
  const R = appRect(t), c = inW(R, [BELL.cx, BELL.cy]), r = BELL.r * R.w / APPW;
  if (t < T.END0) return { cx: c[0], cy: c[1], r };
  const k = spr(t - T.END0, 0.78, 9, 1.1);
  return { cx: lerp(c[0], LOCK.bx, k), cy: lerp(c[1], LOCK.by, k) - Math.sin(Math.PI * clamp(k, 0, 1)) * 60, r: lerp(r, LOCK.br, k) };
}
const bellRect = b => ({ x: b.cx - b.r, y: b.cy - b.r, w: 2 * b.r, h: 2 * b.r });
const bellOn = t => t >= T.I_BELL;
function bellRot(t) { return 0.42 * (ringOut(t - T.HIT, 5.5, 30, 0.85) + 0.8 * ringOut(t - T.RING2, 6, 30, 0.8) + 0.5 * ringOut(t - T.BLAND, 6, 30, 0.7)); }
function bellGulp(t) { let s = 0; for (const t0 of [T.N2_OUT, T.N3_OUT, T.N4_OUT]) s += 0.18 * ringOut(t - t0 - OUTD, 9, 26, 0.6); return 1 + s + 0.1 * ringOut(t - T.I_BELL, 10, 28, 0.6); }
let LOCK = { bx: 540, by: 520, br: 44, tx: 612, ty: 548, sub: 612, suby: 610 };   // measured in __ready

// The one moving card: what it is (kind), its rect and how far it has become itself (k: content alpha)
function card(t) {
  const out = (A, t0) => { const u = cubicIn(seg(t, t0, t0 + OUTD)); const B = bellRect(bellWorld(t)); return { rect: lerpRect(A, B, u), k: 1 - sstep(0, 0.35, u), fill: u }; };
  if (t >= T.N1_0 && t < T.MOD0) { const k = spr(t - T.N1_0, 0.72, 15, 0.7); return { kind: 'new', rect: lerpRect(bellRect(bellWorld(t)), NC1, k), k: sstep(0.45, 0.95, k) }; }
  if (t >= T.MOD0 && t < T.CELL0) { const k = spr(t - T.MOD0, 0.74, 14, 0.75); return { kind: 'modal', from: 'new', rect: lerpRect(NC1, MOD1, k), k, mk: k }; }
  if (t >= T.CELL0 && t < T.LAND) { const u = ease.quintInOut(seg(t, T.CELL0, T.LAND)); return { kind: 'fold', rect: lerpRect(MOD1, blockWorld(t), u), k: u }; }
  if (t >= T.N2_0 && t < T.N2_OUT + OUTD) { if (t >= T.N2_OUT) return { kind: 'chg', ...out(NC2C, T.N2_OUT) };
    const k = spr(t - T.N2_0, 0.72, 15, 0.7); return { kind: 'chg', rect: lerpRect(bellRect(bellWorld(t)), NC2C, k), k: sstep(0.45, 0.95, k) }; }
  if (t >= T.N3_0 && t < T.N3_OUT + OUTD) { if (t >= T.N3_OUT) return { kind: 'rem', ...out(NC3, T.N3_OUT) };
    const k = spr(t - T.N3_0, 0.7, 14, 0.75); return { kind: 'rem', rect: lerpRect(blockWorld(t), NC3, k), k: sstep(0.4, 0.95, k), grow: 1 - k }; }
  if (t >= T.N4_0 && t < T.N4_OUT + OUTD) { if (t >= T.N4_OUT) return { kind: 'del', ...out(NC2, T.N4_OUT) };
    const u = ease.expoOut(seg(t, T.N4_0, T.N4_0 + 0.24)); return { kind: 'del', rect: lerpRect(blockWorld(t), NC2, u), k: sstep(0.5, 0.95, u), grow: 1 - u }; }
  return null;
}
function formRect(t) { if (t < T.FOLD0) return FORM; return lerpRect(FORM, CAPSULE, ease.quintInOut(seg(t, T.FOLD0, T.FOLD1))); }
function capsule(t) {                         // Maya's booking, folded, flies over the midline into the bell
  if (t < T.FOLD1 || t >= T.HIT) return null;
  const b = bellWorld(t), from = { x: CAPSULE.x + CAPSULE.w / 2, y: CAPSULE.y + CAPSULE.h / 2 };
  const p = OM.hop(t, T.FOLD1, T.HIT, from, { x: b.cx, y: b.cy }, { height: 150, curve: cubicIn });
  const sh = sstep(0.55, 1, p.k), w = lerp(CAPSULE.w, 2 * b.r, sh), h = lerp(CAPSULE.h, 2 * b.r, sh);
  return { x: p.x - w / 2, y: p.y - h / 2, w, h, k: p.k, sh };
}
function mayaCaps(t) { if (t < T.GROW0) return MCAPS1; return lerpRect(MCAPS1, MCAPS2, ease.quintInOut(seg(t, T.GROW0, T.GROW1))); }
function paneRect(t) {                         // Maya's detail modal grows out of her name, and folds back into it on delete
  if (t < T.MP0) return null;
  const c = mayaCaps(t);
  if (t < T.M_TRASH + 0.05) return { ...lerpRect(c, PANE, spr(t - T.MP0, 0.74, 13, 0.8)), k: spr(t - T.MP0, 0.74, 13, 0.8) };
  const u = ease.expoOut(seg(t, T.M_TRASH + 0.05, T.M_TRASH + 0.33)); if (u >= 1) return null;
  return { ...lerpRect(PANE, c, u), k: 1 - u };
}

// ────────────────────────────── camera ──────────────────────────────
const KEYS = [
  { t: 0, x: 960, y: 540, zoom: 1 },
  { t: 2.15, x: 960, y: 540, zoom: 1 },
  { t: 2.85, x: 985, y: 530, zoom: 1.02, curve: ease.sineInOut },
  { t: 4.55, x: 985, y: 530, zoom: 1.02 },
  { t: 5.15, x: 992, y: 532, zoom: 1.03, curve: ease.sineInOut },
  { t: 6.15, x: 992, y: 532, zoom: 1.03 },
  { t: 7.45, x: 960, y: 540, zoom: 1, curve: ease.cubicInOut },
  { t: 8.5, x: 960, y: 540, zoom: 1 },
  { t: 9.5, x: 985, y: 556, zoom: 1.035, curve: ease.sineInOut },
  { t: 13.35, x: 985, y: 556, zoom: 1.035 },
  { t: 13.9, x: 992, y: 572, zoom: 1.04, curve: ease.sineInOut },
  { t: 15.4, x: 992, y: 572, zoom: 1.04 },
  { t: 15.75, x: 985, y: 540, zoom: 1.035, curve: ease.expoInOut },
  { t: 16.9, x: 985, y: 540, zoom: 1.035 },
  { t: 17.65, x: 960, y: 540, zoom: 1, curve: ease.cubicInOut },
];
const HITS = [[T.HIT, 4.5, 10], [T.LAND, 3, 11], [T.N4_0, 3, 12], [T.BLAND, 2, 11]];
const WIN = [[0.1, 3.4], [4.45, 5.35], [6.2, 9.95], [15.35, 15.85], [16.75, 18.1]];
const handEnv = t => WIN.reduce((a, [a0, b0]) => a + sstep(a0, a0 + 0.25, t) * (1 - sstep(b0 - 0.25, b0, t)), 0);
function camAt(t) {
  const c = OM.camera(t, KEYS), e = handEnv(t) * 3.2;
  let x = c.x + e * (Math.sin(1.7 * t) + 0.6 * Math.sin(2.9 * t + 1)) / c.zoom, y = c.y + e * (Math.sin(1.3 * t + 2) + 0.5 * Math.sin(3.3 * t)) / c.zoom, rot = c.rot;
  for (const [th, amp, decay] of HITS) { if (t - th > 0.8) continue; const s = OM.shake(t, th, { amp, decay, seed: Math.round(th * 100) }); x += s.x / c.zoom; y += s.y / c.zoom; rot += s.rot; }
  return { x, y, zoom: c.zoom, rot };
}

// ────────────────────────────── the hands (world knots, projected) ──────────────────────────────
let IRIS_HAND = [], MAYA_HAND = [];
const IRIS_CLICKS = [T.I_BELL, T.I_CLICK], MAYA_CLICKS = [T.M_ATT, T.CONFIRM, T.M_PENCIL, T.M_TRASH];
function irisHand(t) { const a = sstep(0.15, 0.35, t) * (1 - sstep(6.35, 6.65, t)); if (a < 0.01) return null; return { ...OM.cursor(t, IRIS_HAND, IRIS_CLICKS), a }; }
function mayaHand(t) { const a = sstep(0.45, 0.65, t) * (1 - sstep(1.95, 2.2, t)) + sstep(7.45, 7.7, t) * (1 - sstep(15.75, 16.05, t));
  if (a < 0.01) return null; return { ...OM.cursor(t, MAYA_HAND, MAYA_CLICKS), a }; }

// ────────────────────────────── drawing ──────────────────────────────
let NOISE = null, CAM = null;
function ground() {
  setM(SCREEN);
  const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, '#2a4570'); gr.addColorStop(1, '#152640');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const rg = g.createRadialGradient(W * 0.5, H * 0.42, 220, W * 0.5, H * 0.5, 1250); rg.addColorStop(0, 'rgba(255,255,255,0.05)'); rg.addColorStop(1, 'rgba(0,0,0,0.22)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = NOISE; g.fillRect(0, 0, cv.width, cv.height);
}
function lattice(cam) {
  const L = OM.lattice(cam, { depth: 1.2, spacing: 48, px: 1.2 }); setM(L.matrix); g.fillStyle = 'rgba(255,255,255,0.07)';
  g.beginPath(); for (let x = L.x0; x <= L.x1; x += L.spacing) for (let y = L.y0; y <= L.y1; y += L.spacing) { g.moveTo(x + L.r, y); g.arc(x, y, L.r, 0, Math.PI * 2); } g.fill();
}
function nameCapsule(x, y, h, letter, name, change = true) {     // the product's "I  Iris  Change" pill
  const s = h / 32; g.save(); g.translate(x, y); g.scale(s, s);
  const w = 12 + 22 + 8 + tw(name, 15, 500) + (change ? 8 + tw('Change', 11.5, 500) : 0) + 12;
  rr(0, 0, w, 32, 16); g.fillStyle = 'rgba(255,255,255,0.08)'; g.fill(); g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,0.28)'; g.stroke();
  g.beginPath(); g.arc(23, 16, 11, 0, Math.PI * 2); g.fillStyle = C.yel; g.fill();
  text(letter, 23, 20.5, 12, 700, '#3b2f0a', 'center');
  text(name, 42, 21.5, 15, 500, '#ffffff');
  if (change) text('Change', 42 + tw(name, 15, 500) + 8, 21, 11.5, 500, 'rgba(255,255,255,0.8)');
  g.restore(); return w * s;
}
function bellGlyph(cx, cy, r, col, rot = 0, slash = false) {
  const u = r / 17; g.save(); g.translate(cx, cy); g.scale(u, u);
  g.translate(0, -8); g.rotate(rot); g.translate(0, 8);
  g.beginPath(); g.moveTo(-6.5, 3.5); g.lineTo(-6.5, -1.5); g.bezierCurveTo(-6.5, -6, -3.6, -8.2, 0, -8.2); g.bezierCurveTo(3.6, -8.2, 6.5, -6, 6.5, -1.5);
  g.lineTo(6.5, 3.5); g.lineTo(8.2, 5.4); g.lineTo(-8.2, 5.4); g.closePath();
  g.lineWidth = 1.7; g.lineJoin = 'round'; g.strokeStyle = col; g.stroke();
  g.beginPath(); g.moveTo(-2, 7.6); g.quadraticCurveTo(0, 10, 2, 7.6); g.stroke();
  g.restore();
